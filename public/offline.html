<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODA Market - Hors ligne</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            text-align: center;
            padding: 20px;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 18px;
            max-width: 400px;
            line-height: 1.5;
        }
        .refresh {
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #D4920A;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .refresh:hover {
            background-color: #b87808;
        }
    </style>
</head>
<body>
    <img src="/images/oda-logo.svg" alt="ODA Market Logo" class="logo" width="80" height="80">
    <h1>Vous êtes hors ligne</h1>
    <p>Il semble que vous n'ayez pas de connexion internet. Veuillez vérifier votre connexion et réessayer.</p>
    <button class="refresh" onclick="window.location.reload()">Réessayer</button>
</body>
</html>
